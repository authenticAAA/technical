<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>米国株テクニカル分析</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <header>
    <h1>📈 米国株テクニカル分析</h1>
  </header>

  <section class="controls">
    <input id="ticker" type="text" placeholder="ティッカー (例: AAPL, MSFT, NVDA)" value="AAPL" />
    <select id="period">
      <option value="3mo">3ヶ月</option>
      <option value="6mo">6ヶ月</option>
      <option value="1y" selected>1年</option>
      <option value="2y">2年</option>
      <option value="5y">5年</option>
    </select>
    <select id="interval">
      <option value="1d" selected>日足</option>
      <option value="1wk">週足</option>
      <option value="1h">1時間足</option>
    </select>
    <button id="analyze">分析</button>
  </section>

  <p id="status" class="status"></p>

  <section id="summary" class="summary hidden">
    <div class="verdict" id="verdict"></div>
    <div class="metrics" id="metrics"></div>
    <div class="signals" id="signal-list"></div>
  </section>

  <section class="charts">
    <div class="chart-block">
      <div class="chart-label">価格 / 移動平均 / ボリンジャー / 出来高</div>
      <div id="price-chart" class="chart"></div>
    </div>
    <div class="chart-block">
      <div class="chart-label">RSI (14)</div>
      <div id="rsi-chart" class="chart small"></div>
    </div>
    <div class="chart-block">
      <div class="chart-label">MACD (12, 26, 9)</div>
      <div id="macd-chart" class="chart small"></div>
    </div>
  </section>

  <footer>
    データ提供: Yahoo Finance (yfinance) ／ 本ツールは教育目的であり投資助言ではありません。
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
